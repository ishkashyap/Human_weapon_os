<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Human Weapon OS — Watch 4 Classic & Android Edition</title>
<style>
:root {
  --bg: #0a0c10;
  --panel: #10151d;
  --panel2: #161d28;
  --line: #232c3a;
  --text: #e7ebf2;
  --dim: #8892a3;
  --gold: #c9a227;
  --gold2: #e8c65a;
  --green: #3fb950;
  --red: #f0544c;
  --cyan: #4ea8de;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 system-ui, "Segoe UI", Roboto, Arial, sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(10, 12, 16, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.hdwrap {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px 6px;
}
.brand {
  font-weight: 800;
  letter-spacing: 3px;
  font-size: 15px;
}
.brand span { color: var(--gold); }
.hdright {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pill {
  border: 1px solid var(--line);
  background: var(--panel2);
  padding: 4px 12px;
  border-radius: 999px;
  color: var(--gold2);
  font-size: 12px;
  white-space: nowrap;
}
.pill.watch {
  border-color: #204560;
  color: var(--cyan);
}
nav {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 12px 10px;
}
nav button {
  flex: 0 0 auto;
  background: transparent;
  border: 1px solid transparent;
  color: var(--dim);
  padding: 6px 13px;
  border-radius: 999px;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
}
nav button:hover { color: var(--text); }
nav button.on {
  background: var(--panel2);
  border-color: var(--line);
  color: var(--gold2);
  font-weight: 600;
}
main {
  max-width: 1080px;
  margin: 0 auto;
  padding: 18px 16px 80px;
}
.grid { display: grid; gap: 14px; margin-bottom: 14px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: 1fr 1fr 1fr; }
.g4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 840px) {
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
}
.grid .card { margin-bottom: 0; }
.card h3 {
  margin: 0 0 12px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 700;
}
.score-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 8px;
}
.big {
  font-size: 26px;
  font-weight: 800;
  color: var(--gold2);
}
.dim { color: var(--dim); font-size: 12px; }
.small { font-size: 12px; }
.gold { color: var(--gold2); }
.cyan { color: var(--cyan); }
.progress {
  height: 10px;
  background: #0c1017;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.progress i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #8a6d12, var(--gold2));
  border-radius: 999px;
  transition: width 0.3s ease;
}
.ring {
  width: 132px;
  height: 132px;
  display: block;
  margin: 0 auto;
}
.ringbg { fill: none; stroke: #1b2432; stroke-width: 10; }
.ringfg {
  fill: none;
  stroke: var(--gold);
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.4s ease;
}
.ringpct {
  fill: var(--text);
  font-size: 24px;
  font-weight: 800;
  text-anchor: middle;
}
.ringsub {
  fill: var(--dim);
  font-size: 10.5px;
  text-anchor: middle;
}
.date-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
input[type="date"], input[type="text"], input[type="number"], select, textarea {
  background: #0c1017;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 7px 10px;
  font: inherit;
  font-size: 13px;
}
input:focus, select:focus, textarea:focus {
  outline: 1px solid var(--gold);
  border-color: var(--gold);
}
.ghead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 16px 0 8px;
}
.ghead b {
  letter-spacing: 1px;
  font-size: 12px;
  text-transform: uppercase;
  color: var(--gold2);
}
.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel2);
  margin-bottom: 6px;
}
label.task { cursor: pointer; user-select: none; }
.task:hover { border-color: var(--gold); }
.task.done {
  border-color: #3c3416;
  background: #151508;
}
.task.done .tl {
  color: var(--dim);
  text-decoration: line-through;
}
.tl { flex: 1; }
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--gold);
  cursor: pointer;
}
.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.btn {
  background: var(--panel2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 7px 13px;
  border-radius: 9px;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
}
.btn:hover {
  border-color: var(--gold);
  color: var(--gold2);
}
.btn.goldbtn {
  background: linear-gradient(180deg, var(--gold2), var(--gold));
  color: #141414;
  border-color: var(--gold);
  font-weight: 700;
}
.btn.ghost { background: transparent; }
.btn.danger { color: var(--red); border-color: #5b2320; }
.btn.sm { padding: 4px 9px; font-size: 11px; border-radius: 7px; }
.arow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #1a222e;
  font-size: 13px;
}
.arow:last-child { border-bottom: 0; }
.amain { flex: 1; min-width: 0; }
.amain b { display: block; font-weight: 600; }
.amain span { color: var(--dim); font-size: 12px; }
.abtns { display: flex; gap: 4px; flex: 0 0 auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl td, .tbl th {
  border-bottom: 1px solid #1a222e;
  padding: 7px 8px;
  text-align: left;
  font-size: 13px;
  vertical-align: top;
}
.tbl th {
  color: var(--dim);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.tbl td.tm {
  color: var(--gold2);
  white-space: nowrap;
  font-weight: 600;
}
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li {
  padding: 7px 0 7px 20px;
  position: relative;
  border-bottom: 1px dashed #1b2330;
  font-size: 13px;
}
ul.plain li:last-child { border-bottom: 0; }
ul.plain li:before {
  content: "\25B8";
  position: absolute;
  left: 2px;
  color: var(--gold);
}
.warn {
  border-left: 3px solid var(--red);
  background: #1a1214;
  padding: 10px 13px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 12px;
}
.note {
  border-left: 3px solid var(--gold);
  background: #15130a;
  padding: 10px 13px;
  border-radius: 8px;
  font-size: 13px;
}
.bars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 125px;
}
.bar {
  flex: 1;
  min-height: 3px;
  background: linear-gradient(180deg, var(--gold2), #7a5e10);
  border-radius: 3px 3px 0 0;
}
.barlabels {
  display: flex;
  gap: 4px;
  margin-top: 5px;
}
.barlabels span {
  flex: 1;
  text-align: center;
  font-size: 10px;
  color: var(--dim);
}
.heat {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cell {
  aspect-ratio: 1;
  border-radius: 6px;
  border: 1px solid #1e2734;
}
.cell.none { background: transparent; border-style: dashed; opacity: 0.45; }
.cell.l1 { background: rgba(201, 162, 39, 0.18); }
.cell.l2 { background: rgba(201, 162, 39, 0.36); }
.cell.l3 { background: rgba(201, 162, 39, 0.58); }
.cell.l4 { background: rgba(201, 162, 39, 0.8); }
.cell.l5 { background: var(--gold2); border-color: var(--gold2); }
.legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 11px;
}
.legend .cell { width: 13px; height: 13px; aspect-ratio: auto; }
.metric {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid #1a222e;
}
.metric label { flex: 1; font-size: 13px; }
.metric input { width: 88px; }
.frow { margin-top: 12px; }
.frow label {
  display: block;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 5px;
}
.frow input, .frow select, .frow textarea { width: 100%; }
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 9, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.overlay.hidden { display: none; }
.modal {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  width: 100%;
  max-width: 620px;
  max-height: 88vh;
  overflow: auto;
  padding: 18px;
}
.modhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.mfoot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
}
#toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 340px;
}
.toast {
  background: var(--panel2);
  border: 1px solid var(--gold);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.report {
  background: #fff;
  color: #000;
  padding: 18px;
  border-radius: 10px;
}
.report h2 { margin: 0 0 4px; font-size: 18px; }
.report table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.report th, .report td {
  border: 1px solid #999;
  padding: 4px 7px;
  font-size: 12px;
  text-align: left;
}
.report th { background: #eee; }
.watch-stat {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
}
.watch-stat .lbl {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
}
.watch-stat .val {
  font-size: 22px;
  font-weight: 800;
  color: var(--cyan);
  margin-top: 4px;
}
</style>
</head>
<body>
<header>
  <div class="hdwrap">
    <div class="brand">HUMAN WEAPON <span>OS</span></div>
    <div class="hdright">
      <span id="hdWatchStatus" class="pill watch">&#8986; Watch 4 Classic (EEPD)</span>
      <span id="hdDate" class="dim"></span>
      <span id="hdStreak" class="pill"></span>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>

<main>
  <div class="card">
    <h3>Active Log Date</h3>
    <div class="date-bar">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="shiftDate(-1)">&#8592; Prev Day</button>
        <input type="date" id="datePicker" onchange="setCheckDate(this.value)">
        <button class="btn" onclick="shiftDate(1)">Next Day &#8594;</button>
        <button class="btn ghost" onclick="setCheckDate(todayStr())">Jump to Today</button>
        <button class="btn goldbtn" onclick="syncSamsungHealth()">&#8635; Sync Galaxy Watch 4 Classic</button>
      </div>
      <span class="dim" id="dateStatus"></span>
    </div>
  </div>

  <div class="grid g3">
    <div class="card">
      <h3>Habit Progress</h3>
      <svg class="ring" viewBox="0 0 120 120">
        <circle class="ringbg" cx="60" cy="60" r="52"></circle>
        <circle id="ringCircle" class="ringfg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7" transform="rotate(-90 60 60)"></circle>
        <text id="pctText" class="ringpct" x="60" y="57">0%</text>
        <text id="countText" class="ringsub" x="60" y="75">0 / 0 habits</text>
      </svg>
      <div class="progress" style="margin-top:10px"><i id="progBar" style="width: 0%"></i></div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn" onclick="markAll(true)">Check All</button>
        <button class="btn ghost" onclick="markAll(false)">Reset Today</button>
      </div>
    </div>

    <div class="card">
      <h3>Hydration Tracker</h3>
      <div class="score-row">
        <div class="big"><span id="waterText">0</span> <span class="dim" id="waterGoalLabel">/ 3000 ml</span></div>
        <div class="dim" id="waterPctText">0%</div>
      </div>
      <div class="progress"><i id="waterBar" style="width: 0%"></i></div>
      <div class="btn-row">
        <button class="btn" onclick="addWater(250)">+250 ml</button>
        <button class="btn" onclick="addWater(500)">+500 ml</button>
        <button class="btn ghost" onclick="resetWater()">Reset Water</button>
      </div>
      <div class="dim" style="margin-top:10px">Next reminder in <b id="remCount">60 min</b> · room temp only</div>
    </div>

    <div class="card">
      <h3>Today's Training</h3>
      <div class="big" id="dashWoDay">Day A</div>
      <div class="dim" id="dashWoLabel"></div>
      <div style="margin-top:10px;font-size:13px" id="dashWoProgress"></div>
      <div class="btn-row">
        <button class="btn" onclick="go('training')">Open Training</button>
        <button class="btn ghost" onclick="go('checkin')">Open Check-in</button>
        <button class="btn ghost" onclick="go('watch')">Watch Sync</button>
      </div>
    </div>
  </div>

  <!-- Tab-Specific Content View -->
  <div id="tabView"></div>

  <!-- Persistent Habit Checklist -->
  <div class="card" id="checklistCard">
    <h3>Daily Habit Checklist (28 Habits across 5 Groups)</h3>
    <div id="habitList"></div>
  </div>
</main>

<div id="toast"></div>
<div id="ov" class="overlay hidden" onclick="if(event.target===this)closeModal()"></div>

function dstr(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function parseD(s) {
  var p = String(s).split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

function todayStr() { return dstr(new Date()); }

function addDays(s, n) {
  var d = parseD(s);
  d.setDate(d.getDate() + n);
  return dstr(d);
}

function dowOf(s) { return parseD(s).getDay(); }

function lastNDates(n, end) {
  var a = [];
  for (var i = n - 1; i >= 0; i--) a.push(addDays(end, -i));
  return a;
}

function mondayOf(s) {
  return addDays(s, -((dowOf(s) + 6) % 7));
}

function scheduleDay(date) {
  return SCHED[dowOf(date)];
}

// ============================================================================
// SAMSUNG HEALTH & GALAXY WATCH 4 CLASSIC (EEPD) INTEGRATION BRIDGE
// Works via:
// 1. Native Android APK WebView Bridge (`window.AndroidHealthBridge`) reading
//    Health Connect data synced from Samsung Health & Galaxy Watch 4 Classic.
// 2. Samsung Health CSV/JSON Data Export file parser (`importSamsungHealthFile`).
// 3. Test Sync Simulator when previewing inside a desktop browser.
// ============================================================================
function applyWatchPayload(date, payload) {
  var log = ensureLog(date);
  if (!log.watch) log.watch = {};

  if (payload.steps != null) log.watch.steps = +payload.steps;
  if (payload.sleepHrs != null) {
    log.watch.sleepHrs = +(+payload.sleepHrs).toFixed(1);
    log.sleepHrs = log.watch.sleepHrs;
  }
  if (payload.avgHr != null) log.watch.avgHr = Math.round(+payload.avgHr);
  if (payload.restingHr != null) log.watch.restingHr = Math.round(+payload.restingHr);
  if (payload.activeKcal != null) log.watch.activeKcal = Math.round(+payload.activeKcal);
  if (payload.workoutMin != null) log.watch.workoutMin = Math.round(+payload.workoutMin);
  if (payload.spo2 != null) log.watch.spo2 = Math.round(+payload.spo2);
  log.watch.syncedAt = new Date().toLocaleTimeString();
  log.watch.device = payload.device || "Galaxy Watch4 Classic (EEPD)";

  // Auto-check habits based on Galaxy Watch 4 Classic thresholds
  var autoChecked = [];
  var stepGoal = (DB.settings && DB.settings.stepGoal) || 8000;
  if (DB.settings.autoCheckWalk !== false && log.watch.steps >= stepGoal) {
    if (!log.tasks.h_walk) autoChecked.push("Evening walk");
    log.tasks.h_walk = true;
  }
  if (DB.settings.autoCheckSleep !== false && log.watch.sleepHrs >= 7.0) {
    if (!log.tasks.h_sleep) autoChecked.push("Sleep by 10 PM");
    log.tasks.h_sleep = true;
  }
  if (DB.settings.autoCheckTraining !== false && log.watch.workoutMin >= 25) {
    if (!log.tasks.h_training) autoChecked.push("Morning training");
    log.tasks.h_training = true;
  }

  saveState();
  render();
  var msg = "Synced Galaxy Watch 4 Classic (" + (log.watch.steps || 0) + " steps, " + (log.watch.sleepHrs || 0) + "h sleep)";
  if (autoChecked.length) msg += " — Auto-checked: " + autoChecked.join(", ");
  showToast(msg);
}

function importSamsungHealthFile(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function() {
    var text = String(r.result || "");
    try {
      // Check if JSON format
      if (text.trim().charAt(0) === "{" || text.trim().charAt(0) === "[") {
        var obj = JSON.parse(text);
        var item = Array.isArray(obj) ? obj[obj.length - 1] : obj;
        applyWatchPayload(checkDate, {
          steps: item.step_count || item.steps || item.count || 0,
          sleepHrs: item.sleep_duration ? +(item.sleep_duration / 60).toFixed(1) : (item.sleepHrs || 7.5),
          avgHr: item.heart_rate || item.avgHr || 68,
          restingHr: item.resting_hr || item.restingHr || 58,
          activeKcal: item.calorie || item.activeKcal || 420,
          workoutMin: item.exercise_duration ? Math.round(item.exercise_duration / 60000) : (item.workoutMin || 35)
        });
        return;
      }
      // Parse Samsung Health CSV export (e.g. com.samsung.shealth.step_daily_trend.csv)
      var lines = text.split(/\r?\n/).filter(function(line) { return line.trim().length > 0; });
      var headerIdx = -1;
      for (var i = 0; i < Math.min(5, lines.length); i++) {
        if (lines[i].indexOf("count") >= 0 || lines[i].indexOf("step") >= 0 || lines[i].indexOf("calorie") >= 0 || lines[i].indexOf("heart_rate") >= 0) {
          headerIdx = i;
          break;
        }
      }
      if (headerIdx >= 0 && lines.length > headerIdx + 1) {
        var cols = lines[headerIdx].split(",");
        var lastRow = lines[lines.length - 1].split(",");
        var map = {};
        for (var c = 0; c < cols.length; c++) {
          map[cols[c].trim().toLowerCase()] = lastRow[c] ? lastRow[c].trim() : "";
        }
        var steps = parseInt(map.count || map.step_count || map.steps || "0", 10);
        var cal = parseFloat(map.calorie || map.active_calorie || "0");
        var hr = parseFloat(map.heart_rate || map.mean || "0");
        applyWatchPayload(checkDate, {
          steps: isNaN(steps) ? 0 : steps,
          activeKcal: isNaN(cal) ? 0 : Math.round(cal),
          avgHr: isNaN(hr) || hr === 0 ? 68 : Math.round(hr)
        });
      } else {
        showToast("Unrecognized CSV columns — use step_daily_trend or exercise CSV from Samsung Health.");
      }
    } catch (e) {
      showToast("Could not parse Samsung Health export file.");
    }
  };
  r.readAsText(f);
  input.value = "";
}

function avgPct(n) {

  if (!days.length) return null;

  var c = 0;
  for (var i = 0; i < days.length; i++) {

  }
  return Math.round((c / days.length) * 100);
}

function currentStreak() {
  var streak = 0;
  var d = todayStr();
  if (pctOf(d) < STREAK_MIN) d = addDays(d, -1);
  while (pctOf(d) >= STREAK_MIN && streak < 3650) {
    streak++;
    d = addDays(d, -1);
  }
  return streak;
}

function pearson(xs, ys) {
  var n = xs.length;
  if (n < 5) return null;
  var mx = xs.reduce(function(a, b) { return a + b; }, 0) / n;
  var my = ys.reduce(function(a, b) { return a + b; }, 0) / n;
  var num = 0, dx = 0, dy = 0;
  for (var i = 0; i < n; i++) {
    var a = xs[i] - mx, b = ys[i] - my;
    num += a * b;
    dx += a * a;
    dy += b * b;
  }
  if (!dx || !dy) return null;
  return num / Math.sqrt(dx * dy);
}

function linreg(ys) {
  var n = ys.length;
  if (n < 4) return null;
  var mx = (n - 1) / 2;
  var my = ys.reduce(function(a, b) { return a + b; }, 0) / n;
  var num = 0, den = 0;
  for (var i = 0; i < n; i++) {
    num += (i - mx) * (ys[i] - my);
    den += (i - mx) * (i - mx);
  }
  if (!den) return null;
  var slope = num / den;
  return { slope: slope, intercept: my - slope * mx, n: n };
}

function valOf(l, key, d) {
  if (!l) return null;
  if (key === "pct") return isLogged(d) ? pctOf(d) : null;
  if (key === "study") {
    var c = 0;
    if (l.tasks && l.tasks.h_study1) c++;
    if (l.tasks && l.tasks.h_study2) c++;
    return isLogged(d) ? c : null;
  }
  if (key === "steps") return (l.watch && l.watch.steps != null) ? +l.watch.steps : null;
  if (key === "sleepHrs" || key === "mood" || key === "energy" || key === "pain") {
    return (l[key] == null || l[key] === "") ? null : +l[key];
  }
  if (key.charAt(0) === "h") {
    return isLogged(d) ? (l.tasks && l.tasks[key] ? 1 : 0) : null;
  }
  return null;
}

function corr(a, b) {
  var dates = lastNDates(28, todayStr());
  var xs = [], ys = [];
  for (var i = 0; i < dates.length; i++) {
    var d = dates[i], l = DB.logs[d];
    var x = valOf(l, a, d), y = valOf(l, b, d);
    if (x == null || y == null) continue;
    xs.push(x);
    ys.push(y);
  }
  return { r: pearson(xs, ys), n: xs.length };
}

  var blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "human-weapon-os-backup-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 3000);
  showToast("Backup JSON downloaded.");
}

function importFile(input) {
  var f = input.files && input.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function() {
    try {
      var o = JSON.parse(r.result);
      if (!o || typeof o !== "object" || !o.logs) throw new Error("Invalid format");
      DB.logs = o.logs;
      if (o.settings) DB.settings = Object.assign({}, DB.settings, o.settings);
      saveState();
      render();
      showToast("Backup imported (" + Object.keys(DB.logs).length + " logged days).");
    } catch (e) {
      showToast("Could not read backup JSON file.");
    }
  };
  r.readAsText(f);
  input.value = "";
}

function weeklyReport() {
  var m = mondayOf(todayStr()), t = todayStr(), rows = [], sum = 0, n = 0;
  for (var i = 0; i < 7; i++) {
    var d = addDays(m, i), lg = isLogged(d), p = lg ? pctOf(d) : null, l = getLog(d);
    if (lg) { sum += p; n++; }

      "<tr><td>" + DOW[dowOf(d)] + "</td><td>" + d + "</td><td>" + (lg ? p + "%" : "-") + "</td>"
      + "<td>" + (l.watch && l.watch.steps ? l.watch.steps : "-") + "</td>"
      + "<td>" + (lg ? (l.water || 0) : "-") + "</td><td>" + (l.sleepHrs == null ? "-" : l.sleepHrs) + "</td>"
      + "<td>" + (l.mood == null ? "-" : l.mood) + "</td><td>" + (l.pain == null ? "-" : l.pain) + "</td>"

    + rows.join("") + '</table>'

    '<div class="modhead"><b>Weekly Report</b><span><button class="btn goldbtn" onclick="window.print()">Print</button> <button class="btn ghost" onclick="closeModal()">Close</button></span></div>' + html

function nextRows(count) {
  var tt = getTimetable();
  var now = new Date();
  var mins = now.getHours() * 60 + now.getMinutes();
  var idx = -1;
  for (var i = 0; i < tt.length; i++) {
    var m = /^(\d{1,2}):(\d{2})/.exec(tt[i].time || "");
    if (!m) continue;
    var rowMins = (+m[1]) * 60 + (+m[2]);
    if (rowMins > mins) {
      idx = i;
      break;
    }
  }
  if (idx < 0) {
    return '<div class="dim" style="padding:6px 0">Day is done. Sleep by 22:00 — protect the 8 hours.</div>';
  }
  var out = "";
  for (var j = idx; j < Math.min(idx + count, tt.length); j++) {
    out += '<div class="arow"><div class="amain"><b>' + esc(tt[j].time) + '</b><span>' + esc(tt[j].activity) + '</span></div></div>';
  }
  return out;
}

}

function render() {
  var log = getLog(checkDate);
  var habits = getHabits();
  var waterGoal = (DB.settings && DB.settings.waterGoal) || 3000;

  document.getElementById("hdDate").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "short",
    day: "numeric",
    month: "short"
  });

  var streak = currentStreak();
  document.getElementById("hdStreak").textContent = streak > 0
    ? "\u25C6 " + streak + "-day streak"
    : "\u25C6 start today";

  var w = log.watch || {};
  var watchPill = document.getElementById("hdWatchStatus");
  if (watchPill) {
    watchPill.textContent = w.steps != null
      ? "\u231A Watch 4: " + w.steps.toLocaleString() + " steps"
      : "\u231A Watch 4 Classic (EEPD)";
  }

  var picker = document.getElementById("datePicker");
  picker.value = checkDate;
  picker.max = todayStr();
  document.getElementById("dateStatus").textContent = checkDate === todayStr()
    ? "Viewing Today"
    : "Viewing Past Log (" + checkDate + ")";

  var doneCount = 0;
  for (var i = 0; i < habits.length; i++) {
    if (log.tasks[habits[i].id]) doneCount++;
  }
  var total = habits.length;
  var pct = total ? Math.round((doneCount / total) * 100) : 0;

  var circumference = 2 * Math.PI * 52;
  var offset = circumference * (1 - pct / 100);
  document.getElementById("ringCircle").setAttribute("stroke-dasharray", String(circumference));
  document.getElementById("ringCircle").setAttribute("stroke-dashoffset", String(offset));

  document.getElementById("pctText").textContent = pct + "%";
  document.getElementById("countText").textContent = doneCount + " / " + total + " habits";
  document.getElementById("progBar").style.width = pct + "%";

  var water = log.water || 0;
  var waterPct = Math.min(100, Math.round((water / waterGoal) * 100));
  document.getElementById("waterText").textContent = water;
  document.getElementById("waterGoalLabel").textContent = "/ " + waterGoal + " ml";
  document.getElementById("waterPctText").textContent = waterPct + "%";
  document.getElementById("waterBar").style.width = waterPct + "%";

  var msLeft = Math.max(0, (DB.settings.reminderMin || 60) * 60000 - (Date.now() - (DB.settings.lastWaterAt || Date.now())));
  var remEl = document.getElementById("remCount");
  if (remEl) remEl.textContent = Math.ceil(msLeft / 60000) + " min";

  var woDay = log.workoutDay || scheduleDay(checkDate);
  var wo = WORKOUTS[woDay];
  var exDoneCount = 0;
  if (wo) {
    for (var k = 0; k < wo.exercises.length; k++) {
      var st = log.exercises[wo.exercises[k].id];
      if (st && st.done) exDoneCount++;
    }
  }
  document.getElementById("dashWoDay").textContent = "Day " + woDay;
  document.getElementById("dashWoLabel").textContent = wo ? wo.label : "";
  document.getElementById("dashWoProgress").textContent = wo
    ? exDoneCount + " / " + wo.exercises.length + " exercises completed"
    : "";

  document.getElementById("tabView").innerHTML = renderTabContent(log);

  var html = "";
  for (var g = 0; g < GROUPS.length; g++) {
    var groupName = GROUPS[g];
    var groupHabits = habits.filter(function(h) { return h.group === groupName; });
    if (!groupHabits.length) continue;
    var groupDone = groupHabits.filter(function(h) { return log.tasks[h.id]; }).length;

    html += '<div class="ghead"><b>' + esc(groupName) + '</b><span class="dim">' + groupDone + '/' + groupHabits.length + '</span></div>';

    for (var j = 0; j < groupHabits.length; j++) {
      var h = groupHabits[j];
      var isDone = !!log.tasks[h.id];
      html += '<label class="task ' + (isDone ? 'done' : '') + '">'
        + '<input type="checkbox" ' + (isDone ? 'checked' : '') + ' onchange="toggleHabit(\'' + h.id + '\', this.checked)">'
        + '<span class="tl">' + esc(h.name) + '</span>'
        + '</label>';
    }
  }
  document.getElementById("habitList").innerHTML = html;
}

buildTabs();
go("dashboard");
</script>
</body>
</html>
